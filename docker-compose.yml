# 独立端口与卷，不影响本机已有的 aiflow 容器。
name: next-bpm
services:
  postgres:
    image: postgres:18
    container_name: next-bpm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bpm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bpm_dev_password}
      POSTGRES_DB: bpm
      TZ: Asia/Shanghai
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5440}:5432'
    volumes:
      # PostgreSQL 18 的持久化根目录为 /var/lib/postgresql。
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bpm -d bpm']
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres-data:
